<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Studio — React Reusable Components Practice</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Protocol Detection: If opened directly via file:// protocol, automatically redirect to standalone.html -->
    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('standalone.html');
      }
    </script>
    <style>
      .initial-loading-fallback {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        min-height: 100vh;
        background: #080C14;
        color: #F8FAFC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #1E293B;
        border-top-color: #8B5CF6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .fallback-btn {
        margin-top: 1.25rem;
        display: inline-block;
        padding: 0.65rem 1.25rem;
        background: #8B5CF6;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading-fallback">
        <div class="loading-spinner"></div>
        <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">Component Studio</h2>
        <p style="color: #94A3B8; max-width: 500px; font-size: 0.95rem;">
          React Reusable Components Lab is initializing...
        </p>
        <noscript>
          <p style="margin-top: 1rem; color: #F43F5E;">JavaScript is required to run this React application.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
